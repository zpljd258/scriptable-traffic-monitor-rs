[package]
name = "scriptable-traffic-monitor"
version = "1.1.0"
edition = "2021"
authors = ["zpljd258"]
description = "Ultra-low memory traffic monitor for Scriptable widget written in Rust"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
